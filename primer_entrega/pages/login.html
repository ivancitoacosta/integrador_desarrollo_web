<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/login.css" />

    <title>Login</title>
  </head>

  <body>
    <main>
      <section
        class="container-login d-flex justify-content-center align-items-center p-4"
      >
        <!-- Animacion de login -->
        <div class="animation-login-01"></div>
        <div class="animation-login-02"></div>

        <!-- Contenedor de login principal -->
        <div class="container-form">
          <h2 class="text-center">INGRESAR</h2>

          <form class="form-control p-4" id="formLogin">
            <div class="mb-3">
              <label for="emailUser" class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                name="email"
                aria-describedby="emailHelp"
                placeholder="tuEmail@gmail.com"
              />
            </div>
            <div class="mb-3">
              <label for="passwordUser" class="form-label">Contraseña</label>
              <input
                type="password"
                class="form-control"
                name="password"
                placeholder="Ingresa tu contraseña"
              />
            </div>
            <button type="submit" class="btn boton-form">Enviar</button>
          </form>
        </div>
      </section>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script de logica para Login -->
    <script type="module" defer src="../js/utils/login.js"></script>
  </body>
</html>
