<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/contacto.css" />

    <title>Contacto</title>
  </head>
  <body>
    <!-- HEADER BOOTSTRAP -->
    <header class="container-content position-fixed top-0 start-0 end-0">
      <nav class="navbar navbar-expand-lg rounded-5 mt-3 py-3 px-4">
        <div class="container-fluid">
          <a
            href="index.html"
            class="nav_header d-flex align-items-center gap-2"
          >
            <img
              src="../assets/images/icono_logo.png"
              alt="Logo de Veterinaria la Mary"
            />
            <div
              class="text-logo d-flex flex-column justify-content-center gap-1"
            >
              <h1 class="fs-4 fw-medium lh-1 m-0">LA MARY</h1>
              <p class="fs-6 fw-normal text-uppercase lh-1 m-0">Veterinaria</p>
            </div>
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav text-ul ms-auto">
              <li class="nav-item">
                <a class="nav-link" href="../index.html" title="inicio"
                  >INICIO</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link"
                  href="./institucional.html"
                  title="institucion"
                  >INSTITUCION</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#" title="servicio">SERVICIOS</a>
              </li>
              <li class="nav-item active">
                <a
                  class="nav-link"
                  href="./contacto.html"
                  title="contacto"
                  aria-current="page"
                  >CONTACTO</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="contacto">
      <!--CONTACTO-->
      <section class="container">
        <section class="formulario_contacto">
          <form>
            <h2>Escribinos</h2>
            <label>
              Nombre
              <input type="text" placeholder="Tu nombre" />
            </label>

            <label>
              Email
              <input type="email" placeholder="tuemail@email.com" />
            </label>

            <label class="mensaje">
              Mensaje
              <textarea rows="5" placeholder="Dejanos tu mensaje..."></textarea>
            </label>

            <button type="button">Enviar</button>
          </form>
        </section>

        <div class="divider"></div>

        <!--UBICACION-->
        <section class="ubicacion">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d54500.63118410028!2d-58.08282093706933!3d-31.378581515252105!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95ade8093e560701%3A0x5d1d34b223a6f091!2sConcordia%2C%20Entre%20R%C3%ADos!5e0!3m2!1ses-419!2sar!4v1788193425801!5m2!1ses-419!2sar"
            width="500"
            height="400"
            style="border: 0; border-radius: 1rem"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"
          ></iframe>
        </section>
      </section>
    </main>

    <!-- FOOTER  -->
    <footer>
      <div class="container">
        <section class="footer_ubicacion">
          <img
            class="logo_footer"
            src="../assets/images/icono_logo.png"
            alt="Veterinaria la Mary"
          />
          <p>Veterinaria la mary</p>
          <p>Direccion: Calle falsa 123, Ciudad</p>
        </section>
        <section class="enlaces_rapidos">
          <p>Enlaces rápidos</p>
          <ul>
            <li><a href="../index.html">INICIO</a></li>
            <li><a href="institucional.html">INSTITUCION</a></li>
            <li><a href="#" title="servicio">SERVICIOS</a></li>
            <li><a href="contacto.html">CONTACTO</a></li>
          </ul>
        </section>
        <section class="redes_sociales">
          <p>Nuestras Redes Sociales</p>
          <ul>
            <li><img src="../assets/images/whatsapp.png" alt="WhatsApp" /></li>
            <li>
              <img src="../assets/images/instagram.png" alt="Instagram" />
            </li>
            <li><img src="../assets/images/facebook.png" alt="Facebook" /></li>
          </ul>
        </section>
      </div>
      <div class="container_copy">
        <section>
          <p>&copy; 2026 Todos los derechos reservados.</p>
        </section>
      </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
